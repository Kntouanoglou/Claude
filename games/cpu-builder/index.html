<title>CPU Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: three menu screens (welcome, map timeline, chapter levels) and a level screen with a sidebar beside a grid circuit board; stacks on phones. Clean & bright study-app look: white cards, soft shadows, one indigo accent; dark by default, light via the in-game toggle. */
:root {
  --bg: #0f1021;
  --panel: #181a2f;
  --panel2: #20223a;
  --ink: #eceefb;
  --muted: #9ca0c0;
  --line: #2b2e4a;
  --board: #14162b;
  --dot: #23263f;
  --gate: #1d2037;
  --hi: #8f89ff;
  --hi-soft: #27254f;
  --on-hi: #0f1021;
  --lo: #4c5172;
  --float: #38bdf8;
  --err: #fb7185;
  --ok: #34d399;
  --glow: 0 0 0 3px rgba(143, 137, 255, .22), 0 0 22px rgba(143, 137, 255, .18);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  --font-display: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --font-body: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f5f6fb; --panel: #ffffff; --panel2: #f0f1f8; --ink: #1b1e33; --muted: #676c8c; --line: #e3e5f0; --board: #fbfbfe; --dot: #eceef6; --gate: #ffffff; --hi: #4f46e5; --hi-soft: #eef0ff; --on-hi: #ffffff; --lo: #b3b7cb; --float: #0ea5e9; --err: #e11d48; --ok: #059669; --glow: 0 0 0 3px rgba(79, 70, 229, .16); --shadow: 0 1px 2px rgba(27, 30, 51, .04), 0 6px 20px rgba(27, 30, 51, .06);
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15.5px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 56px;
}
#app { max-width: 1180px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
p { margin: 0; }
code, .mono { font-family: var(--font-mono); font-size: .9em; }
code { background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; white-space: nowrap; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--hi); outline-offset: 2px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--hi); }
.btn {
  border: 1px solid var(--line); background: var(--panel2); border-radius: 10px; padding: 8px 14px;
  display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; transition: border-color .15s, box-shadow .15s;
}
.btn:hover:not([disabled]) { border-color: var(--hi); }
.btn.primary { background: var(--hi); border-color: var(--hi); color: var(--on-hi); font-weight: 600; }
.btn.primary:hover:not([disabled]) { box-shadow: var(--glow); }
.btn.big { padding: 12px 22px; font-size: 16px; border-radius: 12px; }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: .4; cursor: default; }
.btn.small { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.link { background: none; border: 0; padding: 0; color: var(--hi); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-family: var(--font-mono); font-weight: 600; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.stars { font-size: 18px; letter-spacing: 2px; color: var(--hi); white-space: nowrap; }
.stars .off { color: var(--line); }

/* ---------- Menu screens ---------- */
.screen { display: flex; flex-direction: column; gap: 28px; max-width: 860px; margin: 0 auto; }
.topnav { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.brand i { width: 10px; height: 10px; border-radius: 3px; background: var(--hi); box-shadow: 0 0 10px var(--hi); }
.steps-nav { display: flex; gap: 4px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.steps-nav button { padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-family: var(--font-mono); font-size: 12.5px; }
.steps-nav button:hover { color: var(--ink); }
.steps-nav button.on { color: var(--hi); border-color: var(--hi); }
.hero { display: flex; flex-direction: column; gap: 14px; }
.hero h1 { font-size: clamp(34px, 6.4vw, 56px); line-height: 1.05; }
.hero h1 em { font-style: normal; color: var(--hi); }
.lede { color: var(--muted); max-width: 62ch; font-size: 17px; }
.sec { font-size: 21px; }
.sub { color: var(--muted); }

/* Welcome: zoom ladder */
.ladder { display: flex; align-items: stretch; gap: 0; overflow-x: auto; padding: 4px 2px 8px; }
.rung { flex: 1 0 104px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; min-width: 0; }
.rung .ic { width: 64px; height: 64px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); display: grid; place-items: center; }
.rung .ic svg { width: 40px; height: 40px; }
.rung .ic svg * { stroke: var(--hi); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.rung b { font-family: var(--font-display); font-size: 14px; }
.rung span { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.arrow { align-self: flex-start; margin-top: 24px; color: var(--muted); font-size: 18px; flex: none; }
.how { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 12px; }
.how .card b.n { font-family: var(--font-mono); color: var(--hi); font-size: 13px; }
.how .card p.t { font-family: var(--font-display); font-weight: 600; font-size: 16px; }
.how .card p.d { color: var(--muted); font-size: 14.5px; }
.intro { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.intro p { font-size: 16.5px; line-height: 1.6; }
.intro .goalcard { border-color: var(--hi); box-shadow: var(--glow); }
.topics { display: flex; flex-wrap: wrap; gap: 8px; }
.topics span { font-size: 13.5px; padding: 5px 12px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); }

/* Map: vertical timeline */
.progress { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; }
.pbar { flex: 1 1 220px; height: 8px; background: var(--panel2); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.pbar i { display: block; height: 100%; background: var(--hi); box-shadow: 0 0 12px var(--hi); }
.ptext { font-family: var(--font-mono); font-size: 13.5px; color: var(--muted); }
.ptext b { color: var(--ink); }
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; position: relative; }
.timeline::before { content: ""; position: absolute; left: 21px; top: 22px; bottom: 22px; width: 2px; background: var(--line); }
.tl { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 14px; padding: 6px 0; position: relative; }
.node { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-mono); font-weight: 600; font-size: 15px; background: var(--bg); border: 2px solid var(--line); color: var(--muted); z-index: 1; }
.tl.done .node { background: var(--hi); border-color: var(--hi); color: var(--on-hi); }
.tl.here .node { border-color: var(--hi); color: var(--hi); box-shadow: var(--glow); }
.step {
  text-align: left; width: 100%; border: 1px solid var(--line); background: var(--panel); border-radius: 14px; padding: 12px 16px;
  display: flex; flex-direction: column; gap: 4px; min-width: 0; transition: border-color .15s, box-shadow .15s;
}
.step:hover { border-color: var(--hi); }
.tl.here .step { border-color: var(--hi); box-shadow: var(--glow); }
.tl.later .step { background: transparent; border-style: dashed; }
.tl.later .step .st-name { color: var(--muted); }
.step .st-top { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
.step .st-name { font-family: var(--font-display); font-weight: 600; font-size: 17px; }
.step .st-desc { color: var(--muted); font-size: 14.5px; }
.chip { font-family: var(--font-mono); font-size: 11.5px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.here { color: var(--on-hi); background: var(--hi); border-color: var(--hi); }
.chip.done { color: var(--ok); border-color: var(--ok); }

/* Levels screen */
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.tab { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 7px 14px; font-size: 14px; white-space: nowrap; }
.tab.on { border-color: var(--hi); color: var(--hi); box-shadow: var(--glow); }
.tab[disabled] { opacity: .45; cursor: default; }
.chapter { display: flex; flex-direction: column; gap: 14px; }
.chapter header { display: flex; flex-direction: column; gap: 4px; }
.chapter header p { color: var(--muted); }
.levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 10px; }
.lvcard {
  text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 14px 16px;
  display: flex; flex-direction: column; gap: 4px; min-width: 0; transition: border-color .15s, box-shadow .15s;
}
.lvcard:hover:not([disabled]) { border-color: var(--hi); box-shadow: var(--glow); }
.lvcard.next { border-color: var(--hi); }
.lvcard .ln { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; letter-spacing: .04em; }
.lvcard .lt { font-family: var(--font-display); font-weight: 600; font-size: 17px; }
.lvcard .ls { font-size: 13.5px; color: var(--muted); }
.lvcard[disabled] { opacity: .45; cursor: not-allowed; }
.lvcard .stars { font-size: 14px; }
.foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 18px; }
.foot p { color: var(--muted); font-size: 14px; max-width: 52ch; }

/* ---------- Level ---------- */
.lvtop { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
.lvtop .name { flex: 1 1 200px; min-width: 0; }
.lvtop h1 { font-size: clamp(24px, 4vw, 32px); line-height: 1.1; }
.lv { display: grid; grid-template-columns: minmax(0, 330px) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .lv { grid-template-columns: minmax(0, 1fr); } .stage { order: -1; } }
.side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.goal p { font-size: 16px; }
.hint { font-size: 14.5px; border-left: 3px solid var(--hi); padding: 2px 0 2px 10px; }
.msg { font-size: 14.5px; }
.msg.bad { color: var(--err); }
.msg.good { color: var(--ok); }
.tt { overflow-x: auto; }
.tt table { border-collapse: collapse; width: 100%; font-family: var(--font-mono); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.tt th, .tt td { padding: 4px 8px; text-align: center; border-bottom: 1px solid var(--line); }
.tt th { font-size: 11.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.tt th.sep, .tt td.sep { border-left: 1px solid var(--line); }
.tt tr.cur td { background: var(--hi-soft); }
.tt .y { color: var(--ok); font-weight: 600; }
.tt .n { color: var(--err); font-weight: 600; }
.tt .z { color: var(--float); }
.tt .e { color: var(--err); }
.cost { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.cost .big { font-family: var(--font-display); font-size: 30px; font-weight: 700; line-height: 1; }
.cost .big small { font-family: var(--font-body); font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 4px; }
.cost ul { margin: 0; padding: 0; list-style: none; font-size: 13.5px; color: var(--muted); font-family: var(--font-mono); }

.stage { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.toolbar .grow { flex: 1; }
.part { padding: 4px 9px 4px 6px; }
.part svg { width: 30px; height: 20px; }
.part .pc { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.boardwrap { background: var(--board); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.boardwrap svg.board { display: block; width: 100%; height: auto; touch-action: none; user-select: none; -webkit-user-select: none; }
.tip { font-size: 13.5px; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 18px; height: 4px; border-radius: 2px; margin-right: 6px; vertical-align: middle; background: currentColor; }
.legend .l1 { color: var(--hi); } .legend .l0 { color: var(--lo); } .legend .lz { color: var(--float); } .legend .le { color: var(--err); }
.legend span b { color: var(--muted); font-weight: 500; }

/* board svg */
.board .dots { fill: var(--dot); }
.board .g { fill: var(--gate); stroke: var(--ink); stroke-width: 1.8; stroke-linejoin: round; }
.board .gl { fill: none; stroke: var(--ink); stroke-width: 2; }
.board .st { stroke: var(--ink); stroke-width: 2; }
.board .gt { font-family: var(--font-mono); font-size: 9px; fill: var(--muted); text-anchor: middle; pointer-events: none; }
.board .lbl { font-family: var(--font-display); font-weight: 600; font-size: 14px; fill: var(--ink); text-anchor: middle; pointer-events: none; }
.board .inbox { fill: var(--gate); stroke: var(--ink); stroke-width: 2; }
.board .inbox.on { fill: var(--hi); stroke: var(--hi); }
.board .inval { font-family: var(--font-mono); font-weight: 600; font-size: 15px; text-anchor: middle; fill: var(--ink); pointer-events: none; }
.board .inbox.on + .inval { fill: var(--on-hi); }
.board .lamp { stroke-width: 2; }
.board .lamp.v1 { fill: var(--hi); stroke: var(--hi); }
.board .lamp.v0 { fill: var(--gate); stroke: var(--lo); }
.board .lamp.vz { fill: var(--gate); stroke: var(--float); stroke-dasharray: 4 3; }
.board .lamp.ve { fill: var(--gate); stroke: var(--err); }
.board .lampv { font-family: var(--font-mono); font-weight: 600; font-size: 13px; text-anchor: middle; fill: var(--muted); pointer-events: none; }
.board .lamp.v1 + .lampv { fill: var(--on-hi); }
.board .wire { fill: none; stroke-width: 3; stroke-linecap: round; }
.board .wire.v1 { stroke: var(--hi); stroke-width: 4; }
.board .wire.v0 { stroke: var(--lo); }
.board .wire.vz { stroke: var(--float); stroke-dasharray: 6 4; }
.board .wire.ve { stroke: var(--err); }
.board .wire.sel { stroke-width: 6; }
.board .whit { fill: none; stroke: transparent; stroke-width: 16; cursor: pointer; }
.board .tmp { fill: none; stroke: var(--hi); stroke-width: 3; stroke-dasharray: 5 4; pointer-events: none; }
.board .pin { stroke: var(--ink); stroke-width: 1.5; fill: var(--gate); pointer-events: none; }
.board .pin.v1 { fill: var(--hi); stroke: var(--hi); }
.board .pin.vz { stroke: var(--float); }
.board .pin.ve { fill: var(--err); stroke: var(--err); }
.board .pin.pend { fill: var(--hi); stroke: var(--hi); r: 6; }
.board .hit { fill: transparent; cursor: crosshair; }
.board .comp { cursor: grab; }
.board .selbox { fill: none; stroke: var(--hi); stroke-width: 1.5; stroke-dasharray: 4 3; }
.board .glow { filter: drop-shadow(0 0 4px var(--hi)); }
.board .lamp.v1 { filter: drop-shadow(0 0 8px var(--hi)); }
.board .gridl { stroke: var(--dot); stroke-width: 1; }

/* CMOS board */
.cmos { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; padding: 16px; align-items: stretch; }
@media (max-width: 520px) { .cmos { grid-template-columns: minmax(0, 1fr); } }
.stack { display: flex; flex-direction: column; gap: 0; min-width: 0; }
.rail { font-family: var(--font-mono); font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 6px; display: flex; justify-content: space-between; gap: 8px; }
.rail.vdd { background: var(--hi); color: var(--on-hi); }
.rail.gnd { background: var(--panel2); color: var(--ink); border: 1px solid var(--line); }
.zone { border: 2px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 10px; background: var(--panel); position: relative; }
.zone.on.pu { border-color: var(--hi); }
.zone.on.pd { border-color: var(--muted); background: var(--board); }
.zone .zh { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center; }
.zone .zt { font-family: var(--font-display); font-weight: 600; font-size: 15px; }
.zone .zs { font-size: 12.5px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 4px 10px; font-size: 13px; }
.seg button.on { background: var(--ink); color: var(--panel); }
.vlink { width: 2px; height: 16px; background: var(--line); margin: 0 auto; }
.vlink.on { background: var(--hi); }
.tnet { display: flex; gap: 10px; justify-content: center; align-items: center; min-height: 92px; padding: 8px; border-radius: 8px; }
.tnet.series { flex-direction: column; gap: 0; }
.tnet.parallel { flex-direction: row; flex-wrap: wrap; border-top: 2px solid var(--line); border-bottom: 2px solid var(--line); border-radius: 0; }
.tnet.series .tr + .tr { margin-top: 14px; position: relative; }
.tnet.series .tr + .tr::before { content: ""; position: absolute; top: -16px; left: 50%; width: 2px; height: 14px; background: var(--line); }
.tnet .empty { font-size: 13px; color: var(--muted); }
.tr { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--gate); }
.tr.on { border-color: var(--hi); }
.tr svg { width: 30px; height: 40px; flex: none; }
.tr svg .sw { stroke: var(--lo); stroke-width: 3; stroke-linecap: round; fill: none; }
.tr.on svg .sw { stroke: var(--hi); }
.tr svg .term { fill: var(--ink); }
.tr .tk { font-family: var(--font-mono); font-size: 12px; line-height: 1.2; }
.tr .tk b { display: block; font-size: 13px; }
.tr .tin { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 2px 8px; font-family: var(--font-mono); font-weight: 600; }
.tr .tx { border: 0; background: transparent; color: var(--muted); font-size: 16px; padding: 0 4px; }
.outnode { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 8px 0; }
.outnode .wire { width: 2px; align-self: stretch; }
.bulb { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-mono); font-weight: 700; font-size: 18px; border: 3px solid var(--lo); background: var(--gate); }
.bulb.v1 { background: var(--hi); border-color: var(--hi); color: var(--on-hi); box-shadow: 0 0 18px var(--hi); }
.bulb.v0 { border-color: var(--lo); color: var(--muted); }
.bulb.vz { border-color: var(--float); border-style: dashed; color: var(--float); }
.bulb.vs { border-color: var(--err); color: var(--err); background: var(--panel); animation: buzz .25s infinite alternate; }
@keyframes buzz { from { transform: translateX(-1px); } to { transform: translateX(1px); } }
@media (prefers-reduced-motion: reduce) { .bulb.vs { animation: none; } }
.outnode .ot { font-size: 14px; max-width: 26ch; }
.inputs { display: flex; flex-direction: column; gap: 10px; justify-content: center; }
@media (max-width: 520px) { .inputs { flex-direction: row; justify-content: center; } }
.toggle { border: 2px solid var(--ink); background: var(--gate); border-radius: 10px; width: 64px; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--font-mono); }
.toggle b { font-family: var(--font-display); font-size: 13px; }
.toggle span { font-size: 20px; font-weight: 700; }
.toggle.on { background: var(--hi); border-color: var(--hi); color: var(--on-hi); }
.addrow { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }

/* Truth-table exercise */
.ttx { padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.ttx .q { font-family: var(--font-display); font-size: 20px; font-weight: 600; }
.choices { display: flex; gap: 8px; flex-wrap: wrap; }
.choices .btn { font-family: var(--font-mono); font-size: 18px; min-width: 60px; justify-content: center; }
.choices .btn.wrong { border-color: var(--err); color: var(--err); }
.grid8 { overflow-x: auto; }
.grid8 table { border-collapse: separate; border-spacing: 4px; margin: 0 auto; }
.grid8 th { font-family: var(--font-display); font-size: 16px; padding: 2px 8px; }
.grid8 th.sep { padding-left: 18px; }
.grid8 td.sep { padding-left: 14px; }
.cell { width: 46px; height: 38px; border: 1.5px solid var(--line); border-radius: 7px; background: var(--gate); font-family: var(--font-mono); font-size: 17px; font-weight: 600; }
.cell.v1 { background: var(--hi); border-color: var(--hi); color: var(--on-hi); }
.cell.bad { border-color: var(--err); box-shadow: 0 0 0 2px var(--err); }

/* Modal */
.sheet .why p { color: var(--ink); }
.overlay { position: fixed; inset: 0; background: rgba(10, 16, 13, .5); display: grid; place-items: center; padding: 16px; z-index: 50; }
.overlay[hidden] { display: none; }
.sheet { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; max-width: 560px; width: 100%; max-height: 86vh; overflow: auto; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.sheet h2 { font-size: 24px; }
.sheet .stars { font-size: 34px; }
.sheet ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.sheet .why { background: var(--board); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.sheet .why b.k { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--hi); }
.sheet .rule { background: var(--hi-soft); border-radius: 8px; padding: 10px 12px; }
.sheet table { border-collapse: collapse; width: 100%; font-size: 14px; }
.sheet th, .sheet td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.sheet th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.unlock { font-family: var(--font-mono); font-size: 14px; color: var(--hi); }

/* Clean & bright surfaces */
.card, .step, .lvcard, .tab, .boardwrap, .rung .ic, .how .card { box-shadow: var(--shadow); }
.tl.later .step { box-shadow: none; }
.card, .step { border-radius: 18px; }
.lvcard, .boardwrap { border-radius: 16px; }
.btn { border-radius: 12px; }
.btn.primary { box-shadow: 0 4px 14px rgba(79, 70, 229, .25); }
.hero h1 { font-weight: 800; letter-spacing: -.025em; }
h2, .st-name, .lvcard .lt { font-weight: 700; }
.zone { border-radius: 14px; }
.themebtn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); display: inline-grid; place-items: center; box-shadow: var(--shadow); flex: none; }
.themebtn svg { width: 18px; height: 18px; fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
.themebtn:hover { border-color: var(--hi); }
.navright { display: flex; align-items: center; gap: 10px; }
</style>

<div id="app"></div>
<div id="modal" class="overlay" hidden></div>

<script>
/* =================== Storage =================== */
const STORE = 'cpu-builder-v1';
function loadSave() {
  try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && s.stars) return Object.assign({ stars: {}, boards: {} }, s); } catch (e) {}
  return { stars: {}, boards: {} };
}
let S = loadSave();
const THEME_KEY = 'cpu-builder-theme';
let theme = 'dark';
try { theme = localStorage.getItem(THEME_KEY) === 'light' ? 'light' : 'dark'; } catch (e) {}
document.documentElement.setAttribute('data-theme', theme);
const SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>';
const MOON = '<svg viewBox="0 0 24 24"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"/></svg>';
function themeBtn() { const d = theme === 'dark'; return `<button class="themebtn" data-act="theme" aria-label="Switch to ${d ? 'light' : 'dark'} mode" title="Switch to ${d ? 'light' : 'dark'} mode">${d ? SUN : MOON}</button>`; }
function toggleTheme() {
  theme = theme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
  document.querySelectorAll('.themebtn').forEach(b => b.outerHTML = themeBtn());
}
function persist() { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} }
const app = document.getElementById('app');
const modal = document.getElementById('modal');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* =================== Gates =================== */
const GATES = {
  NOT:  { n: 1, w: 58, cost: 2,  f: a => !a[0] },
  BUF:  { n: 1, w: 58, cost: 4,  f: a => !!a[0] },
  NAND: { n: 2, w: 60, cost: 4,  f: a => !(a[0] && a[1]) },
  NOR:  { n: 2, w: 60, cost: 4,  f: a => !(a[0] || a[1]) },
  AND:  { n: 2, w: 60, cost: 6,  f: a => !!(a[0] && a[1]) },
  OR:   { n: 2, w: 60, cost: 6,  f: a => !!(a[0] || a[1]) },
  XOR:  { n: 2, w: 60, cost: 16, f: a => a[0] !== a[1] },
  XNOR: { n: 2, w: 60, cost: 16, f: a => a[0] === a[1] },
};
function shape(t) {
  const st2 = `<line class="st" x1="0" y1="10" x2="12" y2="10"/><line class="st" x1="0" y1="30" x2="12" y2="30"/>`;
  const bub = cx => `<circle class="g" cx="${cx}" cy="20" r="4"/>`;
  const lab = (x) => `<text class="gt" x="${x}" y="23">${t}</text>`;
  switch (t) {
    case 'AND':  return st2 + `<path class="g" d="M8,2 H32 A18,18 0 0 1 32,38 H8 Z"/><line class="st" x1="50" y1="20" x2="60" y2="20"/>` + lab(27);
    case 'NAND': return st2 + `<path class="g" d="M8,2 H28 A18,18 0 0 1 28,38 H8 Z"/>${bub(50)}<line class="st" x1="54" y1="20" x2="60" y2="20"/>` + lab(25);
    case 'OR':   return st2 + `<path class="g" d="M6,2 Q32,2 50,20 Q32,38 6,38 Q17,20 6,2 Z"/><line class="st" x1="50" y1="20" x2="60" y2="20"/>` + lab(27);
    case 'NOR':  return st2 + `<path class="g" d="M6,2 Q30,2 46,20 Q30,38 6,38 Q17,20 6,2 Z"/>${bub(50)}<line class="st" x1="54" y1="20" x2="60" y2="20"/>` + lab(25);
    case 'XOR':  return st2 + `<path class="g" d="M12,2 Q34,2 50,20 Q34,38 12,38 Q23,20 12,2 Z"/><path class="gl" d="M5,2 Q16,20 5,38"/><line class="st" x1="50" y1="20" x2="60" y2="20"/>` + lab(30);
    case 'XNOR': return st2 + `<path class="g" d="M12,2 Q32,2 46,20 Q32,38 12,38 Q23,20 12,2 Z"/><path class="gl" d="M5,2 Q16,20 5,38"/>${bub(50)}<line class="st" x1="54" y1="20" x2="60" y2="20"/>` + `<text class="gt" x="28" y="23" style="font-size:8px">XNOR</text>`;
    case 'NOT':  return `<line class="st" x1="0" y1="20" x2="6" y2="20"/><path class="g" d="M6,4 L38,20 L6,36 Z"/>${bub(42)}<line class="st" x1="46" y1="20" x2="58" y2="20"/>`;
    case 'BUF':  return `<line class="st" x1="0" y1="20" x2="6" y2="20"/><path class="g" d="M6,4 L42,20 L6,36 Z"/><line class="st" x1="42" y1="20" x2="58" y2="20"/>`;
  }
  return '';
}
function partIcon(t) {
  if (t === 'IN') return `<svg viewBox="-2 -2 58 36"><rect x="0" y="0" width="44" height="32" rx="6" fill="none" stroke="currentColor" stroke-width="3"/><line x1="44" y1="16" x2="54" y2="16" stroke="currentColor" stroke-width="3"/></svg>`;
  if (t === 'OUT') return `<svg viewBox="-2 -2 46 36"><line x1="0" y1="16" x2="12" y2="16" stroke="currentColor" stroke-width="3"/><circle cx="26" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="3"/></svg>`;
  return `<svg viewBox="-2 0 64 40" class="board" style="width:30px;height:20px">${shape(t).replace(/<text[^>]*>[^<]*<\/text>/g, '')}</svg>`;
}

/* =================== Levels =================== */
const NOTES = {
  basics: `<p class="rule"><b>One driver per wire.</b> Two outputs on one wire is a conflict (red). Nothing driving a wire leaves it floating (blue). One output can feed many inputs.</p>
    <ul><li><b>Inputs</b> come from outside (switches); the circuit only reads them.</li><li><b>Outputs</b> are computed from the inputs and control something (here, a light).</li></ul>`,
  cmos: `<p class="rule"><b>CMOS:</b> n-type transistors turn on when the input is 1 and pull the output to 0. p-type turn on when the input is 0 and pull the output to 1.</p>
    <ul><li>The <b>pull-up network</b> (p-types) connects the output to 1. The <b>pull-down network</b> (n-types) connects it to 0.</li>
    <li>So a single CMOS gate is always <b>inverting</b>: NOT, NAND and NOR are built directly.</li>
    <li><b>Series</b>: every transistor must be on to conduct (like AND). <b>Parallel</b>: any one on is enough (like OR).</li></ul>`,
  count: `<p class="rule"><b>Transistor count:</b> NOT, NAND, NOR = inputs × 2. AND, OR = inputs × 2 + 2 (AND = NAND + NOT, OR = NOR + NOT). A gate with tied inputs counts at full size: <code>NOR(A, A) = 4</code>.</p>`,
  nand: `<table class="mini"><tr><th>Need</th><th>NAND-only</th><th>NOR-only</th></tr>
    <tr><td>NOT x</td><td>NAND with both inputs = x</td><td>NOR with both inputs = x</td></tr>
    <tr><td>x AND y</td><td>NAND(x, y), then NOT</td><td><code>NOR(x', y')</code></td></tr>
    <tr><td>x OR y</td><td><code>NAND(x', y')</code></td><td>NOR(x, y), then NOT</td></tr></table>`,
  demorgan: `<p class="rule"><b>De Morgan:</b> <code>(AB)' = A' + B'</code> and <code>(A + B)' = A'B'</code>. Break the bar, change the sign.</p>`,
};

const LEVELS = [
  { id: 'wire', ch: 1, kind: 'gate', title: 'First wire', sub: 'Learn the board',
    inputs: ['A'], outputs: ['F'], parts: [], fn: v => ({ F: v.A }), t2: 0, t3: 0,
    goal: 'Connect switch <b>A</b> to light <b>F</b>. Then tap A to flip it and watch the light follow.',
    notes: NOTES.basics + `<p>Wire colors: <b style="color:var(--hi)">copper = 1</b>, grey = 0, <b style="color:var(--float)">dashed blue = floating</b>, <b style="color:var(--err)">red = conflict</b>.</p>`,
    why: 'A wire copies a signal from its one driver to everything connected to it. The light shows whatever drives its wire.',
    hints: ['Drag from the small dot on the right edge of switch A.', 'Let go on the small dot on the left edge of light F.', 'On a phone you can also tap A\'s dot, then tap F\'s dot.'] },

  { id: 'one', ch: 1, kind: 'cmos', title: 'One switch', sub: 'Meet the n-type',
    inputs: ['A'], fn: v => v.A ? 0 : 'Z', t2: 1, t3: 1, max: 1,
    goal: 'Put <b>one n-type</b> transistor in the pull-down network. The target: output 0 when A = 1, and floating (nothing connected) when A = 0.',
    notes: NOTES.cmos,
    why: 'With A = 0 the n-type is open, so nothing drives the output: it floats. With A = 1 it closes and connects the output to ground (0). Half an inverter: next level adds the other half.',
    hints: ['Press "+ n-type" under the pull-down network (the bottom box).', 'n-type closes when its input is 1.', 'Leave the pull-up network empty for now.'] },

  { id: 'not', ch: 1, kind: 'cmos', title: 'NOT', sub: 'Your first gate', unlock: 'NOT',
    inputs: ['A'], fn: v => v.A ? 0 : 1, t2: 2, t3: 2, max: 2,
    goal: 'Build an inverter: output 1 when A = 0, output 0 when A = 1. Use one p-type and one n-type.',
    notes: NOTES.cmos + NOTES.count,
    why: 'A = 0: the p-type closes and connects the output to 1. A = 1: the n-type closes and connects it to 0. Exactly one side conducts at any time. That is an inverter, and it costs 2 transistors (inputs × 2).',
    hints: ['p-types belong in the pull-up network (top), n-types in the pull-down (bottom).', 'Both transistors take input A.', 'One p-type on top, one n-type on the bottom, both on A.'] },

  { id: 'nand', ch: 1, kind: 'cmos', title: 'NAND', sub: 'Series and parallel', unlock: 'NAND',
    inputs: ['A', 'B'], fn: v => (v.A && v.B) ? 0 : 1, t2: 4, t3: 4, max: 3,
    goal: 'Build NAND: the output is 0 <b>only</b> when A and B are both 1. Choose series or parallel for each network.',
    notes: NOTES.cmos + NOTES.count,
    why: 'Pull-down in series: both n-types must be on (A = 1 and B = 1) to reach 0. Pull-up in parallel: any input at 0 closes a p-type and connects the output to 1. Output = (A·B)\'. 2 inputs × 2 = 4 transistors.',
    hints: ['You need two p-types and two n-types, one of each on A and on B.', 'The output must reach 0 only when BOTH inputs are 1. Which arrangement needs every switch closed?', 'Pull-down: series. Pull-up: parallel.'] },

  { id: 'nor', ch: 1, kind: 'cmos', title: 'NOR', sub: 'The mirror image', unlock: 'NOR',
    inputs: ['A', 'B'], fn: v => (v.A || v.B) ? 0 : 1, t2: 4, t3: 4, max: 3,
    goal: 'Build NOR: the output is 1 <b>only</b> when A and B are both 0.',
    notes: NOTES.cmos + NOTES.count,
    why: 'Pull-up in series: both p-types must be on (A = 0 and B = 0) to reach 1. Pull-down in parallel: any 1 connects the output to 0. NOR is NAND with series and parallel swapped.',
    hints: ['Same parts as NAND.', 'Now the output reaches 1 only when both inputs are 0.', 'Pull-up: series. Pull-down: parallel.'] },

  { id: 'short', ch: 1, kind: 'cmos', title: 'Short circuit', sub: 'Find the bug',
    inputs: ['A', 'B'], fn: v => (v.A && v.B) ? 0 : 1, t2: 4, t3: 4, max: 3,
    prefill: { pu: { mode: 'parallel', ts: [{ t: 'p', in: 'A' }, { t: 'p', in: 'B' }] }, pd: { mode: 'parallel', ts: [{ t: 'n', in: 'A' }, { t: 'n', in: 'B' }] } },
    goal: 'This NAND is broken. For some inputs, power connects straight to ground. Flip the inputs to find when it shorts, then fix it.',
    notes: NOTES.cmos + `<p class="rule">In a working CMOS gate, the pull-up and pull-down networks are <b>complements</b>: when one conducts, the other is open. Series on one side means parallel on the other.</p>`,
    why: 'With both networks in parallel, A = 1, B = 0 turns on the n-type on A and the p-type on B at the same time: a direct path from 1 to 0. Making the pull-down series means it only conducts when the pull-up cannot.',
    hints: ['Try A = 1, B = 0. Which transistors are on?', 'Both boxes conduct at once. One of them needs a different arrangement.', 'Switch the pull-down network to series.'] },

  { id: 'table', ch: 2, kind: 'truth', title: 'Reading the table', sub: 'Truth tables by hand',
    goal: 'Before building gates from tables, build a table yourself: count the rows, fill the inputs in order, then fill the output.',
    notes: `<ul><li>Rows = <b>2ⁿ</b> (n = number of inputs).</li><li>The last column switches every row; each column to the left switches half as often (blocks of 1, 2, 4, 8…).</li><li>First row all 0s, last row all 1s. Fill column by column.</li></ul>
      <p class="rule">NOR is 1 only when <b>all</b> inputs are 0: <code>F = (A + B + C)'</code></p>`,
    why: 'Each new input doubles the rows, because every earlier row appears once with the new input at 0 and once at 1. Counting in binary from 000 to 111 lists every combination exactly once.',
    hints: ['Each input has 2 values, so 3 inputs give 2 × 2 × 2 combinations.', 'Column C: 0 1 0 1 0 1 0 1. Column B: 0 0 1 1 0 0 1 1. Column A: four 0s, then four 1s.', 'For NOR, only the first row (0 0 0) gets F = 1.'] },

  { id: 'nand-not', ch: 2, kind: 'gate', title: 'NOT from NAND', sub: 'Universal gates',
    inputs: ['A'], outputs: ['F'], parts: ['NAND'], fn: v => ({ F: 1 - v.A }), t2: 4, t3: 4,
    goal: 'You only have NAND. Make F = A\' (NOT A).',
    notes: `<p class="rule"><b>Universal gates: NAND and NOR.</b> Each one alone can build any circuit.</p>` + NOTES.nand + NOTES.count,
    why: 'NAND(A, A) = (A·A)\' = A\'. Tying the inputs together turns NAND into NOT. It costs 4 transistors, though, twice a real NOT: tied inputs count at full size.',
    hints: ['One NAND is enough.', 'What happens if both NAND inputs get the same signal?', 'Wire A to both inputs of the NAND, and its output to F.'] },

  { id: 'and', ch: 2, kind: 'gate', title: 'AND', sub: 'Derived gates', unlock: 'AND',
    inputs: ['A', 'B'], outputs: ['F'], parts: ['NAND', 'NOT'], fn: v => ({ F: v.A & v.B }), t2: 8, t3: 6,
    goal: 'Build AND: F = A·B. Three stars for matching the real CMOS cost.',
    notes: NOTES.count + `<p>AND is a <b>derived</b> gate: CMOS can't build it in one stage, because single gates always invert.</p>`,
    why: 'AND = NAND followed by NOT: ((A·B)\')\' = A·B. That is 4 + 2 = 6 transistors, the "inputs × 2 + 2" rule. A NAND used as a NOT costs 8.',
    hints: ['NAND gives the opposite of what you want.', 'Invert the NAND output.', 'NAND(A, B) → NOT → F. Use the NOT part for 3 stars.'] },

  { id: 'or', ch: 2, kind: 'gate', title: 'OR from NAND', sub: 'De Morgan in hardware', unlock: 'OR',
    inputs: ['A', 'B'], outputs: ['F'], parts: ['NAND', 'NOT'], fn: v => ({ F: v.A | v.B }), t2: 12, t3: 8,
    goal: 'Build OR (F = A + B) from NAND and NOT.',
    notes: NOTES.demorgan + NOTES.nand,
    why: 'NAND(A\', B\') = (A\'·B\')\' = A + B by De Morgan. Two NOTs and one NAND: 2 + 2 + 4 = 8 transistors.',
    hints: ['Look at the "x OR y" row of the NAND-only table.', 'Invert both inputs first.', 'NOT A and NOT B go into one NAND.'] },

  { id: 'nor-and', ch: 2, kind: 'gate', title: 'AND from NOR', sub: 'NOR is universal too',
    inputs: ['A', 'B'], outputs: ['F'], parts: ['NOR'], fn: v => ({ F: v.A & v.B }), t2: 12, t3: 12,
    goal: 'Only NOR this time. Build F = A·B.',
    notes: NOTES.demorgan + NOTES.nand,
    why: 'Make A\' = NOR(A, A) and B\' = NOR(B, B), then NOR(A\', B\') = (A\' + B\')\' = A·B. Three NORs, 12 transistors.',
    hints: ['Use the "x AND y" row of the NOR-only column.', 'You need A\' and B\'. A NOR with tied inputs is a NOT.', 'NOR(A,A) and NOR(B,B) feed a third NOR.'] },

  { id: 'inverted', ch: 2, kind: 'gate', title: 'Already inverted', sub: 'Tip from your sheet',
    inputs: ['Ab', 'C'], labels: { Ab: "A'" }, outputs: ['F'], parts: ['NOR', 'NOT'],
    fn: v => ({ F: (1 - v.Ab) & (1 - v.C) }), t2: 8, t3: 4,
    goal: 'The switch gives you <b>A\'</b>, not A. Build F = A·C\'.',
    notes: `<p class="rule">If an input is already inverted, don't invert it again: <code>A·C' = NOR(A', C)</code></p>` + NOTES.demorgan,
    why: 'NOR(A\', C) = (A\' + C)\' = A·C\'. You already had A\', so one NOR does the whole job: 4 transistors. Inverting A\' back into A first wastes gates.',
    hints: ['Write the NOR of the two inputs and simplify it with De Morgan.', '(A\' + C)\' = ?', 'A single NOR on A\' and C is the answer.'] },

  { id: 'shared', ch: 2, kind: 'gate', title: 'Shared signal', sub: 'Make it once, reuse it',
    inputs: ['A', 'B', 'C'], outputs: ['X', 'Y'], parts: ['NAND', 'NOT'],
    fn: v => ({ X: ((1 - v.A) & v.B) ? 0 : 1, Y: ((1 - v.A) & v.C) ? 0 : 1 }), t2: 12, t3: 10,
    goal: 'Two outputs: X = NAND(A\', B) and Y = NAND(A\', C). Both need A\'.',
    notes: `<p class="rule">Make a shared signal (like <code>A'</code>) once and feed it to every gate that needs it.</p>` + NOTES.basics,
    why: 'One NOT makes A\' and its output feeds both NANDs: 2 + 4 + 4 = 10. A second NOT for the same signal adds 2 transistors for nothing.',
    hints: ['Both outputs need A\'.', 'One output can feed many inputs.', 'Make one NOT on A and wire its output to both NANDs.'] },

  { id: 'buffer', ch: 2, kind: 'gate', title: 'Buffer', sub: 'Two NOTs make a copy', unlock: 'BUF', requireGate: true,
    inputs: ['A'], outputs: ['F'], parts: ['NOT'], fn: v => ({ F: v.A }), t2: 4, t3: 4,
    goal: 'Build a buffer: F = A, using gates (a plain wire doesn\'t count).',
    notes: `<p class="rule"><b>Buffer:</b> output equals input. Used to strengthen or delay a signal. Built from NOT + NOT.</p><p>Double bar cancels: <code>(A')' = A</code>.</p>`,
    why: '(A\')\' = A. A buffer keeps the value but drives a fresh, strong signal. Inside your own logic, two NOTs in a row are wasted gates: delete both.',
    hints: ['One NOT gives A\'.', 'Invert it again.', 'A → NOT → NOT → F.'] },

  { id: 'xor', ch: 2, kind: 'gate', title: 'XOR', sub: 'The chapter puzzle', unlock: 'XOR',
    inputs: ['A', 'B'], outputs: ['F'], parts: ['NAND'], fn: v => ({ F: v.A ^ v.B }), t2: 20, t3: 16,
    goal: 'NAND only. Build XOR: F = 1 when A and B are different. Two stars at 20 transistors, three at 16.',
    notes: `<p>XOR: output is 1 when the inputs are different. <code>A ⊕ B = A·B' + A'·B</code></p>` + NOTES.nand + NOTES.demorgan,
    why: 'N = NAND(A, B). Then NAND(A, N) = A\' + A·B = A\' + B, and NAND(B, N) = A + B\'. The final NAND gives ((A\' + B)·(A + B\'))\' = A·B\' + A\'·B by De Morgan, which is XOR. Sharing N between two gates saves one NAND: 4 NANDs, 16 transistors.',
    hints: ['Straight from SOP: two NOTs (as NANDs), two NANDs, one final NAND = 20. That earns two stars.', 'For three stars, start with N = NAND(A, B). It is 0 only when both inputs are 1.', 'Feed N into NAND(A, N) and NAND(B, N), then combine those two with a fourth NAND.'] },

  { id: 'xnor', ch: 2, kind: 'gate', title: 'XNOR', sub: 'Cheapest wins', unlock: 'XNOR',
    inputs: ['A', 'B'], outputs: ['F'], parts: ['NAND', 'NOR', 'NOT', 'XOR'], fn: v => ({ F: 1 - (v.A ^ v.B) }), t2: 18, t3: 16,
    goal: 'Build XNOR: F = 1 when A and B are the same. Any parts you like. Can you beat XOR + NOT?',
    notes: `<p>XNOR is the opposite of XOR: <code>(A ⊕ B)'</code>. Your XOR part counts as 16 transistors (4 NANDs).</p>` + NOTES.count,

/* =================== Simulation =================== */
function pinsOf(c) {
  if (c.type === 'IN') return [{ id: 'o', x: 52, y: 16, out: 1 }];
  if (c.type === 'OUT') return [{ id: 'i', x: 0, y: 16 }];
  const g = GATES[c.type];
  if (g.n === 1) return [{ id: 'i0', x: 0, y: 20 }, { id: 'o', x: g.w, y: 20, out: 1 }];
  return [{ id: 'i0', x: 0, y: 10 }, { id: 'i1', x: 0, y: 30 }, { id: 'o', x: 60, y: 20, out: 1 }];
}
function bbox(c) { if (c.type === 'IN') return { w: 52, h: 32 }; if (c.type === 'OUT') return { w: 42, h: 32 }; return { w: GATES[c.type].w, h: 40 }; }
function simulate(circ, inVals) {
  const par = {};
  const find = x => { if (!(x in par)) par[x] = x; while (par[x] !== x) { par[x] = par[par[x]]; x = par[x]; } return x; };
  for (const c of circ.comps) for (const p of pinsOf(c)) find(c.id + ':' + p.id);
  for (const w of circ.wires) { if (!(w.a in par) || !(w.b in par)) continue; const a = find(w.a), b = find(w.b); if (a !== b) par[a] = b; }
  const drv = {};
  for (const c of circ.comps) for (const p of pinsOf(c)) if (p.out) { const n = find(c.id + ':' + p.id); (drv[n] || (drv[n] = [])).push(c.id); }
  const out = {};
  for (const c of circ.comps) out[c.id] = c.type === 'IN' ? (inVals && c.id in inVals ? inVals[c.id] : (c.v || 0)) : 0;
  const nets = [...new Set(Object.keys(par).map(find))];
  let nv = {}, stable = false;
  const calc = () => { nv = {}; for (const n of nets) { const d = drv[n] || []; nv[n] = d.length === 0 ? 'Z' : d.length > 1 ? 'E' : out[d[0]]; } };
  for (let it = 0; it < 64; it++) {
    calc(); let ch = false;
    for (const c of circ.comps) {
      if (c.type === 'IN' || c.type === 'OUT') continue;
      const ins = pinsOf(c).filter(p => !p.out).map(p => nv[find(c.id + ':' + p.id)]);
      const v = ins.some(x => x === 'Z' || x === 'E') ? 'E' : (GATES[c.type].f(ins) ? 1 : 0);
      if (out[c.id] !== v) { out[c.id] = v; ch = true; }
    }
    if (!ch) { stable = true; break; }
  }
  calc();
  const outVal = {};
  for (const c of circ.comps) if (c.type === 'OUT') outVal[c.id] = nv[find(c.id + ':i')];
  return { nv, find, out, stable, outVal };
}
function circCost(circ) { return circ.comps.reduce((a, c) => a + (GATES[c.type] ? GATES[c.type].cost : 0), 0); }
function rowsFor(n) { const r = []; for (let i = 0; i < (1 << n); i++) { const row = []; for (let b = n - 1; b >= 0; b--) row.push((i >> b) & 1); r.push(row); } return r; }

const BW = 600, BH = 420;
function makeCirc(lv) {
  const comps = [];
  const ni = lv.inputs.length, no = lv.outputs.length;
  lv.inputs.forEach((k, i) => comps.push({ id: 'in-' + k, type: 'IN', key: k, label: (lv.labels && lv.labels[k]) || k, x: 20, y: Math.round((BH / (ni + 1)) * (i + 1) - 16), v: 0, fixed: 1 }));
  lv.outputs.forEach((k, i) => comps.push({ id: 'out-' + k, type: 'OUT', key: k, label: k, x: BW - 62, y: Math.round((BH / (no + 1)) * (i + 1) - 16), fixed: 1 }));
  return { comps, wires: [], seq: 1 };
}
function loadCirc(lv) {
  const saved = S.boards[lv.id];
  if (saved && saved.comps) {
    const base = lv.sandbox ? { comps: [], wires: [] } : makeCirc(lv);
    for (const f of base.comps) if (!saved.comps.some(c => c.id === f.id)) saved.comps.push(f);
    return saved;
  }
  if (lv.sandbox) return { comps: [
    { id: 'in-A', type: 'IN', label: 'A', x: 20, y: 120, v: 0 }, { id: 'in-B', type: 'IN', label: 'B', x: 20, y: 260, v: 0 },
    { id: 'out-F', type: 'OUT', label: 'F', x: BW - 62, y: 190 } ], wires: [], seq: 1 };
  return makeCirc(lv);
}
function pinPos(circ, key) {
  const [id, pid] = key.split(':'); const c = circ.comps.find(c => c.id === id); if (!c) return null;
  const p = pinsOf(c).find(p => p.id === pid); return p ? { x: c.x + p.x, y: c.y + p.y, out: p.out } : null;
}
function wirePath(a, b) {

  return `M${a.x},${a.y} C${a.x + ha},${a.y} ${b.x + hb},${b.y} ${b.x},${b.y}`;

  if (a === 'map') return showMap();
  if (a === 'welcome') return showWelcome();
  if (a === 'levels') { modal.hidden = true; return showLevels(+b.dataset.ch || 1); }
  if (a === 'preview') return showPreview(+b.dataset.ch);
  if (a === 'level') { modal.hidden = true; return openLevel(b.dataset.id); }
  if (a === 'sandbox') return openLevel('sandbox');
  if (a === 'close') { modal.hidden = true; return; }
  if (a === 'reset') return openModal(`<h2>Reset progress?</h2><p>This clears every star and saved circuit in this browser.</p><div class="row"><button class="btn primary" data-act="reset-yes">Reset everything</button><button class="btn" data-act="close">Cancel</button></div>`);
  if (a === 'reset-yes') { S = { stars: {}, boards: {} }; persist(); return home(); }
  if (!cur) return;
  const lv = cur.lv;
  if (a === 'notes') return openModal(`<span class="eyebrow">From your CS310 sheet</span><h2>${esc(lv.title)}</h2>${lv.notes}<div class="row"><button class="btn primary" data-act="close">Back to the board</button></div>`);
  if (a === 'hint') { cur.hints = Math.min((lv.hints || []).length, cur.hints + 1); return renderHints(); }
  if (a === 'test') return lv.kind === 'cmos' ? testCmos() : testGate();
  if (a === 'add') return addPart(b.dataset.part);
  if (a === 'undo' && cur.undo.length) { cur.redo.push(JSON.stringify(cur.circ)); cur.circ = JSON.parse(cur.undo.pop()); cur.sel = null; return update(); }
  if (a === 'redo' && cur.redo.length) { cur.undo.push(JSON.stringify(cur.circ)); cur.circ = JSON.parse(cur.redo.pop()); cur.sel = null; return update(); }
  if (a === 'del') return delSel();
  if (a === 'clear') { snapState(); const fixed = lv.sandbox ? [] : cur.circ.comps.filter(c => c.fixed); cur.circ = { comps: lv.sandbox ? loadCirc({ id: '__none', sandbox: true }).comps : fixed, wires: [], seq: cur.circ.seq }; cur.sel = null; cur.msg = ''; return update(); }
  // CMOS
  const cm = cur.cm;
  if (a === 'cm-add') { cm[b.dataset.net].ts.push({ t: b.dataset.t, in: lv.inputs[0] }); cur.msg = ''; return update(); }
  if (a === 'cm-del') { cm[b.dataset.net].ts.splice(+b.dataset.i, 1); return update(); }
  if (a === 'cm-mode') { cm[b.dataset.net].mode = b.dataset.mode; return update(); }
  if (a === 'cm-in') { const t = cm[b.dataset.net].ts[+b.dataset.i]; t.in = lv.inputs[(lv.inputs.indexOf(t.in) + 1) % lv.inputs.length]; return update(); }
  if (a === 'cm-tog') { cm.vals[b.dataset.in] ^= 1; return update(); }
  if (a === 'cm-reset') { delete S.boards[lv.id]; cur.cm = loadCmos(lv); cur.msg = ''; return update(); }
  // truth
  const tt = cur.tt;
  if (a === 'tt-rows') { const n = +b.dataset.n; if (n === 8) tt.step = 1; else { tt.mistakes++; if (!tt.wrong.includes(n)) tt.wrong.push(n); } return renderTruth(); }
  if (a === 'tt-cell') { const r = +b.dataset.r, c = +b.dataset.c, v = tt.cells[r][c]; tt.cells[r][c] = v === null ? 0 : 1 - v; delete tt.bad[r + ',' + c]; return renderTruth(); }
  if (a === 'tt-check') return ttCheck();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !modal.hidden) { modal.hidden = true; return; }
  if (!cur || cur.lv.kind !== 'gate' || !modal.hidden) return;
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); delSel(); }
  else if (e.key === 'Escape') { cur.pending = null; cur.sel = null; update(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); document.querySelector(e.shiftKey ? '[data-act=redo]' : '[data-act=undo]')?.click(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); document.querySelector('[data-act=redo]')?.click(); }
});

home();
</script>
